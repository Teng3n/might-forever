name: Sync Warcraft Logs data

on:
  # Warcraft Logs is not configured for Might Forever yet.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-warcraft-logs-data
  cancel-in-progress: false

jobs:
  sync-wcl:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync Warcraft Logs data
        run: npm run sync:wcl
        env:
          WCL_CLIENT_ID: ${{ secrets.WCL_CLIENT_ID }}
          WCL_CLIENT_SECRET: ${{ secrets.WCL_CLIENT_SECRET }}
          WCL_REPORT_LIMIT: ${{ vars.WCL_REPORT_LIMIT || 20 }}
          WCL_REPORT_PAGES: ${{ vars.WCL_REPORT_PAGES || 25 }}
          WCL_GUILD_SOURCES_JSON: >-
            ${{ vars.WCL_GUILD_SOURCES_JSON || '[{"guildName":"Vitality","serverSlug":"raden","region":"US","label":"Vitality - Raden","expansions":["mop"],"tiers":["tier-14","tier-15","tier-16"]},{"guildId":482914,"guildName":"Might","serverSlug":"fairbanks","region":"US","label":"Might - Fairbanks","expansions":["classic","tbc"],"tiers":["classic-mc-ony","classic-bwl","classic-aq","classic-naxx","tbc-tier-4","tbc-tier-5"]},{"guildId":619658,"guildName":"Inept","serverSlug":"grobbulus","region":"US","label":"Inept - Grobbulus","expansions":["tbc","wrath"],"tiers":["tbc-tier-5","tbc-tier-6","tbc-sunwell","wrath-tier-7","wrath-tier-8","wrath-tier-9","wrath-tier-10"]},{"guildId":738773,"guildName":"Inept","serverSlug":"benediction","region":"US","label":"Inept - Benediction","expansions":["cata"],"tiers":["cata-tier-11","cata-tier-12","cata-tier-13"]}]' }}

      - name: Check WCL generated data changes
        id: changes
        shell: bash
        run: |
          if git diff --quiet -- src/data/wclReports.json src/data/wclBossAttendance.json src/data/wclBossAttendanceSummary.json src/data/wclGuildProgress.json src/data/wclProgressionSeed.json src/data/wclRankings.json src/data/wclSyncMeta.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No Warcraft Logs data changes detected."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- src/data/wclReports.json src/data/wclBossAttendance.json src/data/wclBossAttendanceSummary.json src/data/wclGuildProgress.json src/data/wclProgressionSeed.json src/data/wclRankings.json src/data/wclSyncMeta.json
          fi

      - name: Commit WCL generated data
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/wclReports.json src/data/wclBossAttendance.json src/data/wclBossAttendanceSummary.json src/data/wclGuildProgress.json src/data/wclProgressionSeed.json src/data/wclRankings.json src/data/wclSyncMeta.json
          git commit -m "chore(data): sync Warcraft Logs archive data"
          for attempt in 1 2 3; do
            git pull --rebase origin might-forever
            if git push; then
              exit 0
            fi
            sleep 5
          done
          exit 1
