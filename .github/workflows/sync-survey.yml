name: Sync Might Forever survey insights

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-might-forever-survey
  cancel-in-progress: false

jobs:
  sync-survey:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: vitality-forever

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build aggregate survey insights
        run: npm run sync:survey
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SURVEY_SHEET_ID: 1EuKIShP55UUqlD0H3Ho_n00W9vaYnHcGMcdzDH9AcGw
          SURVEY_RESPONSES_RANGE: "'Form Responses 1'!A:M"

      - name: Commit aggregate changes
        shell: bash
        run: |
          if git diff --quiet -- src/data/surveyInsights.json; then
            echo "No survey insight changes detected."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/surveyInsights.json
          git commit -m "chore(data): sync Might Forever survey insights"
          git pull --rebase origin vitality-forever
          git push origin HEAD:vitality-forever
