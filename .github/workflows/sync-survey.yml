name: Sync Might Forever survey insights

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: sync-might-forever-survey
  cancel-in-progress: true

jobs:
  sync-survey:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: might-forever

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/716675836663/locations/global/workloadIdentityPools/github-actions/providers/might-forever
          service_account: vitality-sheets-sync@vitaliy-mop.iam.gserviceaccount.com

      - name: Build public and encrypted survey data
        run: npm run sync:survey
        env:
          SURVEY_DATA_ENCRYPTION_KEY: ${{ secrets.SURVEY_DATA_ENCRYPTION_KEY }}
          SURVEY_SHEET_ID: 1EuKIShP55UUqlD0H3Ho_n00W9vaYnHcGMcdzDH9AcGw
          SURVEY_RESPONSES_RANGE: "'Form Responses 1'!A:M"

      - name: Commit survey data changes
        shell: bash
        run: |
          if git diff --quiet -- src/data/surveyInsights.json src/data/surveyResponses.enc.json; then
            echo "No survey insight changes detected."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/surveyInsights.json src/data/surveyResponses.enc.json
          git commit -m "chore(data): sync Might Forever survey insights"
          git pull --rebase origin might-forever
          git push origin HEAD:might-forever
